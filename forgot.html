<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/signin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/forgot.css" />
  </head>
  <body>
   
      <div class="all">
        <div class="in">
          <div class="top">
            <div class="top-first">
              <div class="left-top-bottom">
                <div style="" class="left">Forgot Password</div>
              </div>
            </div>
            <div style="color: #595b61; font-size: 13px" class="top-second">
              <b
                >Enter your email to reset your password</b
              >
            </div>
          </div>
          <form action="">
            <div class="email-div" id="email-div">
              <label for="email"
                >Email Address <span style="color: red">*</span></label
              >
              <input id="email" type="email" placeholder="example@gmail.com" />
            </div>
            
            <div class="btn-div" id="btn-div">
            <input id="button" type="button" value="Send Instructions" >
            </div>
          </form>
          <div class="lower">
            <div class="lower-third">
              <a style="color: #0d60dc" href="/signin.html">Go back</a>
            </div>
          </div>
        </div>
      </div>
  </body>
</html>
